<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var t = localStorage.getItem('cycle.theme')
        if (t === 'light' || t === 'dark') {
          document.querySelector('meta[name="color-scheme"]').content = t
        }
      } catch {}
    </script>
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#fcf9fa"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#141213"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cycle" />
    <meta property="og:title" content="Cycle" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cycle.ericc.ch/" />
    <meta property="og:site_name" content="Cycle" />
    <meta property="og:image" content="https://cycle.ericc.ch/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Cycle, with its dot-grid mark" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://cycle.ericc.ch/og-image.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon-dark.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Cycle</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/entry.tsx"></script>
  </body>
</html>
