<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .tile { fill: #f5eef1; }
    .muted { fill: #c2b2ba; }
    .bleeding { fill: #e04876; }
    .spotting { fill: #a86496; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #1c191b; }
      .muted { fill: #574c51; }
      .bleeding { fill: #f4729b; }
      .spotting { fill: #d495c4; }
    }
  </style>
  <rect class="tile" width="64" height="64" rx="10" />
  <circle class="muted" cx="18" cy="18" r="4.5" />
  <circle class="muted" cx="32" cy="18" r="4.5" />
  <circle class="muted" cx="46" cy="18" r="4.5" />
  <circle class="bleeding" cx="18" cy="32" r="5.5" />
  <circle class="bleeding" cx="32" cy="32" r="5.5" />
  <circle class="bleeding" cx="46" cy="32" r="5.5" />
  <circle class="spotting" cx="18" cy="46" r="5.5" />
  <circle class="muted" cx="32" cy="46" r="4.5" />
  <circle class="muted" cx="46" cy="46" r="4.5" />
</svg>
